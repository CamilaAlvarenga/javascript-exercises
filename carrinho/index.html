<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
    <style>
        body {
            background-color: rgb(25, 25, 25);
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            padding: 20px;
        }

        p {
            font-size: 24px;
        }

        button {
            background-color: transparent;
            border: 2px solid white;
            border-radius: 8px;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 5px;
            margin-bottom: 8px;
            font-family: Arial, Helvetica, sans-serif;
        }

        button:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <p>Cart Quantity</p>

    <button onclick="
        displayCartQuantity();
    ">Show Quantity</button>

    <button onclick="
        updateCartQuantity(1);
    ">Add to Cart</button>

    <button onclick="
        updateCartQuantity(2);
    ">+2</button>
    <button onclick="
        updateCartQuantity(3);
    ">+3</button>

    <button onclick="
        updateCartQuantity(4);
    ">+4</button>

    <button onclick="
        updateCartQuantity(5);
    ">+5</button>

    <button onclick="
        updateCartQuantity(-1);
    ">Remove from cart</button>

    <button onclick="
        updateCartQuantity(-2);
    ">-2</button>

    <button onclick="
        updateCartQuantity(-3);
    ">-3</button>

    <button onclick="
        cartQuantity = 0;
        console.log('Cart was reset');
        displayCartQuantity();
    ">Reset Cart</button>

    <p class="js-cart-quantity"></p>

    <script>
        let cartQuantity = 0;

        function updateCartQuantity(value){
            if (cartQuantity + value > 10) {
                alert('The cart is full');
                return;
            } else if (cartQuantity + value < 0) {
                alert('Not enough items in the cart');
                return;
            } else {
                cartQuantity += value;
                displayCartQuantity();
            }
        }

        function displayCartQuantity() {
            document.querySelector('.js-cart-quantity').innerHTML = `Cart quantity: ${cartQuantity}`;
        }
        
    </script>
</body>
</html>
