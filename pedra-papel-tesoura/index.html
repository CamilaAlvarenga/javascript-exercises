<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(25, 25, 25);
            color: white;
        }

        .title{
            font-size: 30px;
            font-weight: bold;
        }

        .move-icon{
            height: 50px;
        }

        .move-button{
            background-color: transparent;
            border: 3px solid white;
            border-radius: 60px;
            width: 120px;
            height: 120px;
            margin-right: 10px;
            cursor: pointer;
        }

        .result{
            font-size: 25px;
            font-weight: bold;
            margin-top: 50px;
        }
        
        .score{
            margin-top: 60px;
        }

        .reset-score-button,
        .auto-play-button,
        .reset-score-button{
            background-color: white;
            border: none;
            font-size: 15px;
            padding: 8px 15px;
            cursor: pointer;
        }

        .reset-confirm-button {
            margin-left: 10px;
        }

    </style>
</head>
<body>
    <p>Rock Paper Scissors</p>

    <button class="move-button js-rock-button">
        <img src="images/rock-emoji.png" alt="rock" class="move-icon">
    </button>

    <button class="move-button js-paper-button">
        <img src="images/paper-emoji.png" alt="" class="move-icon">
    </button>

    <button class="move-button js-scissors-button">
        <img src="images/scissors-emoji.png" alt="" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button class="reset-score-button js-reset-score-button">Reset Score</button>

    <button class="auto-play-button js-auto-play-button">Auto Play</button>

    <p class="js-reset-confirmation"></p>

    <script>
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
        };

        updateScoreElement();

        let isAutoPlaying = false;
        let intervalId;

        document.querySelector('.js-auto-play-button')
            .addEventListener('click', () => {
            autoPlay();
        });

        function autoPlay() {
            if (!isAutoPlaying) {
                intervalId = setInterval(() => {
                    const playerMove = pickComputerMove();
                    playGame(playerMove);
                }, 1000);
                isAutoPlaying = true;

                document.querySelector('.js-auto-play-button').innerHTML = 'Stop Playing';

            } else {
                clearInterval(intervalId);
                isAutoPlaying = false;
                document.querySelector('.js-auto-play-button').innerHTML = 'Auto Play';
            }
        }

        document.querySelector('.js-rock-button').addEventListener('click', () => {
            playGame('rock');
        });

        document.querySelector('.js-paper-button').addEventListener('click', () => {
            playGame('paper');
        });

        document.querySelector('.js-scissors-button').addEventListener('click', () => {
            playGame('scissors');
        });

        document.body.addEventListener('keydown', (event) => {
            if (event.key === 'r' || event.key === 'R') {
                playGame('rock');
            } else if (event.key === 'p' || event.key === 'P') {
                playGame('paper');
            } else if (event.key === 's' || event.key === 'S') {
                playGame('scissors');
            } else if (event.key === 'a' || event.key === 'A') {
                autoPlay();
            } else if (event.key === ' ') {
                event.preventDefault();
                showResetConfirmation();
            }
        });

        function playGame(playerMove) {
            const computerMove = pickComputerMove();

            let result = ''; 

            if (playerMove === 'scissors'){ 
                if (computerMove === 'rock') {
                    result = 'You lose.';
                } else if (computerMove === 'paper') {
                    result = 'You win.';
                } else if (computerMove === 'scissors') {
                    result = 'Tie.';
                }

            } else if (playerMove === 'paper'){
                if (computerMove === 'rock') {
                result = 'You win.';
                } else if (computerMove === 'paper') {
                result = 'Tie.';
                } else if (computerMove === 'scissors') {
                result = 'You lose.';
                }
                
            } else if (playerMove === 'rock'){
                if (computerMove === 'rock') {
                result = 'Tie.';
                } else if (computerMove === 'paper') {
                result = 'You lose.';
                } else if (computerMove === 'scissors') {
                result = 'You win.';
                }
            }

            if (result === 'You win.') {
                score.wins ++;
            } else if (result === 'You lose.') {
                score.losses ++;
            } else if (result === 'Tie.') {
                score.ties ++;
            }

            localStorage.setItem('score', JSON.stringify(score));

            updateScoreElement();

            document.querySelector('.js-result').innerHTML = result;
            document.querySelector('.js-moves').innerHTML = `You <img src="images/${playerMove}-emoji.png" alt="" class="move-icon">
            <img src="images/${computerMove}-emoji.png" alt="" class="move-icon">
            Computer`;

        }

        function updateScoreElement() {
            document.querySelector('.js-score')
            .innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
        }

        function resetScore() {
            score.wins = 0;
            score.losses = 0;
            score.ties = 0;
            localStorage.removeItem('score');
            updateScoreElement();
        }

        document.querySelector('.js-reset-score-button')
            .addEventListener('click', () => {
            showResetConfirmation();
        });

        function showResetConfirmation() {
            document.querySelector('.js-reset-confirmation').innerHTML = `
            Are you sure you want to reset the score? 
            <button class="js-reset-confirm-yes reset-confirm-button">Yes</button>
            <button class="js-reset-confirm-no reset-confirm-button">No</button>
            `;

            document.querySelector('.js-reset-confirm-yes').addEventListener('click', () => {
                resetScore();
                hideResetConfirmation();
            });

            document.querySelector('.js-reset-confirm-no').addEventListener('click', () => {
                hideResetConfirmation();
            });
}

        function hideResetConfirmation() {
            document.querySelector('.js-reset-confirmation').innerHTML = '';
        }

        function pickComputerMove() {
            const randomNumber = Math.random();

            let computerMove = '';

            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = 'rock';
            } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = 'paper';
            } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerMove = 'scissors';
            }

            return computerMove;
        }
    </script>
</body>
</html>
